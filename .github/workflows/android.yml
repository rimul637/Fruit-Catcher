name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or update the matching GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: tools/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test, lint, and package
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Inspect packaged manifest and compatibility
        env:
          VERIFY_SIGNATURES: 'false'
        run: tools/verify-package.sh app/build/outputs/apk/release/*-unsigned.apk app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-checks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.html
            app/build/test-results/testReleaseUnitTest/*.xml

  release:
    needs: verification
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FRUIT_CATCHER_KEYSTORE_BASE64: ${{ secrets.FRUIT_CATCHER_KEYSTORE_BASE64 }}
      FRUIT_CATCHER_STORE_PASSWORD: ${{ secrets.FRUIT_CATCHER_STORE_PASSWORD }}
      FRUIT_CATCHER_KEY_ALIAS: ${{ secrets.FRUIT_CATCHER_KEY_ALIAS }}
      FRUIT_CATCHER_KEY_PASSWORD: ${{ secrets.FRUIT_CATCHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
      - uses: actions/setup-java@v4
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
        run: tools/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
      - name: Build and verify signed files
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          umask 077
          export FRUIT_CATCHER_KEYSTORE="$RUNNER_TEMP/fruit-catcher-release.jks"
          trap 'rm -f "$FRUIT_CATCHER_KEYSTORE"' EXIT
          printf '%s' "$FRUIT_CATCHER_KEYSTORE_BASE64" | base64 --decode > "$FRUIT_CATCHER_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          tools/verify-package.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Fruit-Catcher-v$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Fruit-Catcher-v$version.aab"
          git archive --format=zip --prefix=Fruit-Catcher/ -o "release/Fruit-Catcher-Source-v$version.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
        with:
          name: fruit-catcher-signed
          path: release/*
      - name: Publish signed release files
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "Fruit Catcher $RELEASE_TAG" --generate-notes
          fi
      - name: Report signing configuration
        if: env.FRUIT_CATCHER_KEYSTORE_BASE64 == ''
        run: echo "Signing secrets are absent. The verification build ran, and signed release publication was skipped."
